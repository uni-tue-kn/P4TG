name: Tests

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Controller
            tests
      - name: Build and test controller and Rust integration crate
        run: tests/ci/controller.sh

  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Configuration GUI/package-lock.json
      - name: Build and test GUI
        env:
          CI: true
        run: tests/ci/gui.sh

  p4-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [tofino, tofino2]
    steps:
      - uses: actions/checkout@v4
      - name: Compile P4 program
        run: |
          output=$(mktemp -d /tmp/p4tg-ci-compile-XXXXXX)
          tests/ci/compile-p4.sh "${{ matrix.target }}" "$output"
          test -s "$output/bf-rt.json"

  model-e2e-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        target: [tofino, tofino2]
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim hosted-runner space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker builder prune --all --force
      - name: Build controller test image
        run: tests/ci/build-controller-image.sh
      - name: Compile P4 program
        run: |
          mkdir -p /tmp/p4tg-ci-bundle
          tests/ci/compile-p4.sh "${{ matrix.target }}" /tmp/p4tg-ci-bundle
      - name: Remove compiler image before loading model runtime
        run: |
          docker image rm unituekn/unicornp4-tofino-sdk@sha256:b6a4c770c9c483a2b125e4de4c3d32eb7d046a6e69648c534707ac7a655904a3
          docker builder prune --all --force
      - name: Run model, API, and changelog regression tests
        run: tests/ci/model-smoke.sh "${{ matrix.target }}" /tmp/p4tg-ci-bundle
