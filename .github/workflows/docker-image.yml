name: Controller build

on:
  push:
    branches: [ "nightly"]
  pull_request:
    branches: [ "main", "nightly" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set Docker tag based on branch
      id: vars
      run: |
        if [ "${{ github.ref_name }}" = "nightly" ]; then
          echo "tag=nightly" >> "$GITHUB_OUTPUT"
        else
          echo "tag=dev" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache Node.js modules
      uses: actions/cache@v4
      with:
        path: Configuration\ GUI/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('Configuration GUI/package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Build frontend
      run: cd Configuration\ GUI && npm install && npm run build
      env:
        CI: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Controller Build on Pull Request
      if: github.event_name == 'pull_request'
      run: |
        docker buildx build \
          --file Controller/Dockerfile \
          .

    - name: Controller Build and Publish on Push
      if: github.event_name == 'push'
      run: |
        docker buildx build \
          --cache-from=type=registry,ref=unituekn/p4tg-controller:buildcache \
          --cache-to=type=registry,ref=unituekn/p4tg-controller:buildcache,mode=max \
          --tag unituekn/p4tg-controller:${{ steps.vars.outputs.tag }} \
          --file Controller/Dockerfile \
          --push \
          .
